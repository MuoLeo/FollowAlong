<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoFlow - 휴대폰 연결</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">VideoFlow</div>
    <span class="step-label">STEP 3 / 3 · 휴대폰 연결</span>
  </header>

  <main class="page-center">
    <section class="card connect-card">
      <div class="phone-icon">📱</div>
      <h1>휴대폰 카메라 연결</h1>
      <p class="subtitle">
        휴대폰 카메라로 아래 QR 코드를 촬영해주세요.
      </p>

      <div id="qrCode" class="qr-box">
        <div class="qr-loading">QR 코드 생성 중...</div>
      </div>

      <div class="session-box">
        <span>세션 ID</span>
        <strong id="sessionId">-</strong>
      </div>

      <p class="connection-status">
        <span class="status-dot"></span>
        휴대폰 연결을 기다리는 중...
      </p>

      <div class="demo-warning">
        <strong>현재 데모 모드</strong>
        <p>QR에는 이 PC의 접속 주소가 자동으로 들어갑니다. 휴대폰에서 접근하려면 PC와 휴대폰이 같은 네트워크에 있고, 실제 접속 가능한 주소를 사용해야 합니다.</p>
      </div>

      <button id="backBtn" class="btn secondary">처음으로 돌아가기</button>
    </section>
  </main>

  <!-- QRCode.js: QR 생성용 외부 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./script.js?v=2"></script>
</body>
</html>
