<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FollowAlong - 제작 단계 편집</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">FollowAlong</div>
    <span class="step-label">STEP 2 / 3 · 제작 단계 편집</span>
  </header>

  <main class="editor-page">

    <section class="editor-layout">

      <!-- 영상 미리보기 -->
      <div class="preview-panel">
        <div class="panel-title">분석된 레고 제작 영상</div>

        <video id="previewVideo" controls></video>

        <div id="videoPlaceholder" class="video-placeholder">
          <div>🎬</div>
          <p>분석된 영상이 이곳에 표시됩니다.</p>
        </div>
      </div>

      <!-- 제작 단계 편집 -->
      <aside class="tools-panel">

        <h2>제작 단계 편집</h2>

        <p class="muted">
          서버가 자동으로 분석한 제작 단계를 확인하고 수정할 수 있습니다.
        </p>

        <!-- 단계 목록 -->
        <div class="section-heading">
          <h3>제작 단계 목록</h3>
          <span id="stepCount">총 3단계</span>
        </div>

        <div id="stepList">

          <!-- STEP 1 -->
          <div class="step-item" data-step-id="step_001">
            <div class="step-header">
              <strong>STEP 1</strong>
              <span class="review-status">검토 필요</span>
            </div>

            <input
              type="text"
              class="step-title"
              value="단계 후보 1"
              placeholder="단계 제목"
            >

            <p class="step-transcript">
              먼저 머리의 눈을 조립합니다.
            </p>

            <div class="step-time">
              <label>
                시작 시간
                <input type="number" class="start-time"
                  value="0" min="0" step="0.01">
              </label>

              <label>
                종료 시간
                <input type="number" class="end-time"
                  value="20.03" min="0" step="0.01">
              </label>
            </div>

            <button type="button" class="delete-step-btn">
              단계 삭제
            </button>
          </div>

          <!-- STEP 2 -->
          <div class="step-item" data-step-id="step_002">
            <div class="step-header">
              <strong>STEP 2</strong>
              <span class="review-status">검토 필요</span>
            </div>

            <input
              type="text"
              class="step-title"
              value="단계 후보 2"
              placeholder="단계 제목"
            >

            <p class="step-transcript">
              다음으로 머리와 부리를 조립합니다.
            </p>

            <div class="step-time">
              <label>
                시작 시간
                <input type="number" class="start-time"
                  value="20.03" min="0" step="0.01">
              </label>

              <label>
                종료 시간
                <input type="number" class="end-time"
                  value="36.05" min="0" step="0.01">
              </label>
            </div>

            <button type="button" class="delete-step-btn">
              단계 삭제
            </button>
          </div>

          <!-- STEP 3 -->
          <div class="step-item" data-step-id="step_003">
            <div class="step-header">
              <strong>STEP 3</strong>
              <span class="review-status">검토 필요</span>
            </div>

            <input
              type="text"
              class="step-title"
              value="단계 후보 3"
              placeholder="단계 제목"
            >

            <p class="step-transcript">
              마지막으로 머리와 몸통을 조립합니다.
            </p>

            <div class="step-time">
              <label>
                시작 시간
                <input type="number" class="start-time"
                  value="36.05" min="0" step="0.01">
              </label>

              <label>
                종료 시간
                <input type="number" class="end-time"
                  value="55.733333" min="0" step="0.01">
              </label>
            </div>

            <button type="button" class="delete-step-btn">
              단계 삭제
            </button>
          </div>

        </div>

        <!-- 단계 추가 -->
        <button id="addStepBtn" class="tool-btn">
          + 제작 단계 추가
        </button>

        <div class="tool-note">
          자동 분석된 단계는 검토 후 수정할 수 있습니다.
          단계 추가 및 삭제 사항은 최종 확인 시 서버로 전달됩니다.
        </div>

        <!-- 최종 확인 -->
        <button id="confirmEditBtn" class="btn primary full">
          편집 확인 및 휴대폰 연결
        </button>

      </aside>

    </section>

  </main>

  <script src="./script.js?v=4"></script>
</body>
</html>
