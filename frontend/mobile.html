<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoFlow - 모바일 카메라</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="mobile-body">
  <main class="mobile-page">
    <section class="mobile-card">
      <div class="brand">FollowAlong</div>
      <h1>휴대폰 카메라</h1>
      <p id="sessionMessage" class="subtitle">카메라를 준비하고 있습니다.</p>

      <div class="camera-frame">
        <video id="camera" autoplay playsinline muted></video>
        <div id="cameraOverlay" class="camera-overlay">
          <div class="camera-icon">📷</div>
          <p>카메라 시작 버튼을 눌러주세요.</p>
        </div>
      </div>

      <div class="mobile-actions">
        <button id="startCameraBtn" class="btn primary full">카메라 시작</button>
        <button id="recordBtn" class="btn danger full hidden">● 촬영 시작</button>
        <button id="switchCameraBtn"> 전면 카메라 전환 </button>

        <video id="cameraPreview" autoplay playsinline muted></video>
        <button id="stopBtn" class="btn secondary full hidden">■ 촬영 종료 및 전송</button>
      </div>

      <div id="mobileStatus" class="mobile-status"></div>
    </section>
  </main>

  <script src="./script.js?v=2"></script>
  
</body>
</html>
